{# Seção de identificação do servidor: os campos que o RF identifica, e o e-mail — para onde vai a #}
{# senha de primeiro acesso (SPEC criacao_usuarios/004).                                           #}
<div class="card-well p-5 flex flex-col gap-4">
  <p class="text-overline">Identificação</p>
  <div class="grid sm:grid-cols-3 gap-4">
    <label class="form-field">
      <span class="text-overline">RF</span>
      <input type="text" name="rf" value="{{ perfil.rf|default:'' }}" placeholder="812.345-6" class="input input-glass" />
    </label>
    <label class="form-field">
      <span class="text-overline">Nome</span>
      <input type="text" name="nome" value="{{ perfil.nome|default:'' }}" placeholder="Henrique" class="input input-glass" />
    </label>
    <label class="form-field">
      <span class="text-overline">Sobrenome</span>
      <input type="text" name="sobrenome" value="{{ perfil.sobrenome|default:'' }}" placeholder="Pougy" class="input input-glass" />
    </label>
  </div>
  <label class="form-field">
    <span class="text-overline">E-mail</span>
    <input type="email" name="email" value="{{ perfil.email|default:'' }}" placeholder="ana.ramos@prefeitura.sp.gov.br" class="input input-glass" />
    <span class="form-field-hint">Para cá vai a senha de primeiro acesso. Sem e-mail não há como entregar o acesso.</span>
  </label>
</div>
