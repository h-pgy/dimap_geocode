{# Os diálogos da seção de exercício (SPEC user_admin/015), todos FORA do formulário do servidor:  #}
{# formulário aninhado é HTML inválido e o navegador descarta o interno — o <label for> alcança o  #}
{# modal de qualquer lugar do documento (SPEC 012). Um por cartão e um por substituição em aberto, #}
{# porque é o cartão que responde "substituto de quê?".                                            #}
{% if not exercicio.exonerado %}
  {% include "user_admin/partials/_modal_impedimento.html" %}
  {% if exercicio.afastado %}
    {% include "user_admin/partials/_modal_retorno.html" %}
  {% endif %}

  {% for cartao in exercicio.cartoes %}
    {% if cartao.lacuna %}
      {% include "user_admin/partials/_modal_designar.html" with modal_id=cartao.modal candidatos=cartao.candidatos data_inicio=cartao.lacuna.inicio data_fim=cartao.lacuna.fim %}
    {% endif %}
    {% for item in cartao.substituicoes %}
      {% if not item.encerrada %}
        {% include "user_admin/partials/_modal_designar.html" with modal_id=item.modal_trocar candidatos=item.candidatos data_inicio=item.substituicao.data_inicio data_fim=item.substituicao.data_fim troca=item %}
        {% include "user_admin/partials/_modal_encerrar.html" %}
      {% endif %}
    {% endfor %}
  {% endfor %}
{% endif %}
