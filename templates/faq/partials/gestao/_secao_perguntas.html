{% load faq_formulario %}
{# Adicionar e remover forma redesenham o bloco no servidor, levando o que já foi digitado. #}
<div class="card-well p-5 flex flex-col gap-4"
     id="secao-perguntas"
     hx-target="this"
     hx-swap="outerHTML"
     hx-include="this">
  <p class="text-overline">Pergunta</p>
  <label class="form-field">
    <span class="text-overline">Pergunta principal</span>
    <input type="text" name="pergunta" class="input input-glass {{ realce.pergunta }}" value="{{ valores.pergunta }}" placeholder="Como emitir a certidão de lançamento?" />
    <span class="form-field-hint">É a que aparece na página. As outras formas ajudam a busca a achar a FAQ.</span>
  </label>
  <div class="form-field">
    <span class="text-overline">Outras formas de perguntar</span>
    {% if valores.variacoes %}
      <div class="flex flex-col gap-2">
        {% for variacao in valores.variacoes %}
          <div class="flex items-center gap-2">
            <input type="text" name="{{ variacao.controle }}" class="input input-glass {{ realce|realce_do:variacao.controle }}" value="{{ variacao.texto }}" aria-label="Outra forma de perguntar" />
            <button type="button" class="btn btn-ghost btn-glass btn-sm btn-circle" aria-label="Remover esta forma"
                    hx-get="{% url 'faq:admin_bloco_perguntas' %}" hx-vals='{"remover": "{{ variacao.controle }}"}'>
              <svg class="w-4 h-4 icon-etched" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><use href="#glifo-gestao-x"/></svg>
            </button>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <p class="text-[13px] italic text-base-content/55">Nenhuma ainda.</p>
    {% endif %}
    <div>
      <button type="button" class="btn btn-ghost btn-glass btn-sm gap-1.5"
              hx-get="{% url 'faq:admin_bloco_perguntas' %}" hx-vals='{"adicionar": "1"}'>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><use href="#glifo-gestao-mais"/></svg>
        Outra forma
      </button>
    </div>
  </div>
</div>
