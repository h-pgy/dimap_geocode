{# Glifos dos controles de mapa do Onsen: camadas estacadas, mapa base e satélite/ortofoto. #}
<svg width="0" height="0" class="absolute" aria-hidden="true">
  <defs>
    <!-- Glifo de camadas estacadas: 3 lâminas sobrepostas em perspectiva isométrica -->
    <g id="glifo-camadas">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Glifo de mapa base vetorial: mapa dobrado com traçados -->
    <g id="glifo-mapa-base">
      <path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    </g>
    <!-- Glifo de satélite / ortofoto: globo com órbita e sinal de sensoriamento -->
    <g id="glifo-satelite">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M3.6 9h16.8M3.6 15h16.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <ellipse cx="12" cy="12" rx="4.5" ry="9" fill="none" stroke="currentColor" stroke-width="1.8"/>
    </g>
    <!-- Glifo menos para zoom-out -->
    <g id="glifo-menos">
      <path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <!-- Glifo mais para zoom-in -->
    <g id="glifo-mais">
      <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <!-- Glifos de tipo de gaveta lateral (SPEC design/021): um por tipo, na lista do histórico -->
    <g id="glifo-gaveta-lote">
      <path d="M3 7.5 20 4.5l1 12L4 19.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M8.7 6.5 14.3 5.5l1 12-5.6 1z" fill="currentColor" fill-opacity="0.28" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
    </g>
    <g id="glifo-gaveta-endereco">
      <path d="M12 18s5.5-5 5.5-9.2a5.5 5.5 0 1 0-11 0C6.5 13 12 18 12 18z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
      <circle cx="12" cy="8.8" r="2" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <path d="M6 21h12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    </g>
    <g id="glifo-gaveta-endereco_externo">
      <path d="M12 21a9 9 0 100-18 9 9 0 000 18zM3.6 9h16.8M3.6 15h16.8M12 3c2.5 2.4 3.75 5.4 3.75 9S14.5 18.6 12 21c-2.5-2.4-3.75-5.4-3.75-9S9.5 5.4 12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="glifo-gaveta-logradouro">
      <path d="M2.5 11.5 21.5 5M2.5 19 21.5 12.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      <path d="M2.5 15.25 21.5 8.75" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2.4 2.8"/>
    </g>
    <!-- O estojo da alça da bancada, de _glifos_desenho.html -->
    <g id="glifo-gaveta-desenhos">
      <use href="#glifo-caixa-ferramentas"/>
    </g>
    <!-- Interrogação da .dica-trava -->
    <g id="glifo-interrogacao">
      <path d="M9 9.2a3 3 0 1 1 4.6 2.5c-1 .65-1.6 1.3-1.6 2.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="17.8" r="1.4" fill="currentColor"/>
    </g>
  </defs>
</svg>
