{% if gaveta.pocos %}
<div class="gaveta-lateral">
  <input type="checkbox" id="gaveta-desenhos-toggle" class="gaveta-lateral-toggle" checked>

  <div class="gaveta-lateral-painel glass-drawer-panel-denso">
    <header class="gaveta-lateral-cabecalho">
      <p class="text-overline text-madeira-600">Bancada de desenho</p>
      <h2 class="text-2xl font-bold tracking-tight leading-none text-madeira-700 mt-1">Desenhos no mapa</h2>
    </header>

    <div class="gaveta-lateral-corpo" data-scroll-etched>
      <div class="gaveta-lateral-rolador" data-rolador>
        <div class="gaveta-lateral-conteudo">
          {% for poco in gaveta.pocos %}
            {% include "mapping/_poco_desenhos.html" with poco=poco %}
          {% endfor %}
        </div>
      </div>
      <div class="scroll-etched" data-barra><div class="scroll-etched-thumb" data-polegar></div></div>
    </div>
  </div>

  <label for="gaveta-desenhos-toggle" class="paleta-gaveta" tabindex="0" aria-label="Abrir ou recolher a gaveta">
    <svg class="etched paleta-gaveta-glifo" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
  </label>
</div>
{% endif %}
