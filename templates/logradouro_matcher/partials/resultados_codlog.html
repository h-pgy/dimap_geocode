{# templates/logradouro_matcher/partials/resultados_codlog.html — fragmento HTMX, sem extends #}
{# Recebe: resultados (list[CodlogMatchOutput]) — nunca vazia: seção omitida a montante        #}
<ul class="flex flex-col gap-0.5">
  {% for r in resultados %}
    <li class="suggestion-item items-baseline gap-4"
        hx-post="{% url 'logradouro_geocoder:geocodificar' %}"
        hx-vals='{"codlog": "{{ r.codlog }}{{ r.dv }}"}'
        hx-target="#resultado-busca"
        hx-swap="innerHTML"
    >
      <span class="text-code text-sm w-16 shrink-0">{{ r.codlog }}-{{ r.dv }}</span>
      <span class="font-medium">{{ r.nome_completo }}</span>
      <span class="badge badge-linha badge-sm shrink-0 ml-auto">Logradouro</span>
    </li>
  {% endfor %}
</ul>
