{% load l10n %}
{# Item do poço de ações (SPEC street_view/001). Sem o janela_popup.js, target="_blank" abre o mesmo destino em nova aba. #}
{% if request.user.is_authenticated %}
  <a
    class="btn btn-onsen btn-sm"
    href="{% url 'street_view:abrir' %}?lon={{ ponto.coordinates.0|unlocalize }}&amp;lat={{ ponto.coordinates.1|unlocalize }}"
    target="_blank"
    rel="noopener noreferrer"
    data-janela-popup
    data-aviso-bloqueio="{% url 'street_view:popup_bloqueado' %}?toggle={{ toggle }}"
    title="Abre o Google Street View em outra janela"
  >
    <span class="poco-acoes__icone"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><use href="#glifo-street-view"/></svg></span>
    Visão da rua
  </a>
{% endif %}
