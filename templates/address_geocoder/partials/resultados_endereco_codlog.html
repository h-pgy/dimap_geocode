{# fragmento HTMX, sem extends — recebe: resultados (list[CodlogMatchOutput]), numero (int) #}
{# resultados nunca vazia: seção omitida a montante                                        #}
<ul class="flex flex-col gap-0.5">
  {% for r in resultados %}
    <li class="suggestion-item items-baseline gap-4"
        hx-post="{% url 'address_geocoder:selecionar' %}"
        hx-vals='{"codlog": "{{ r.codlog }}{{ r.dv }}", "numero": "{{ numero }}"}'
        hx-target="#resultado-busca"
        hx-swap="innerHTML">
      <span class="text-code text-sm w-16 shrink-0">{{ r.codlog }}-{{ r.dv }}</span>
      <span class="font-medium">{{ r.nome_completo }}, {{ numero }}</span>
      <span class="badge badge-ponto badge-sm shrink-0 ml-auto">Endereço</span>
    </li>
  {% endfor %}
</ul>
