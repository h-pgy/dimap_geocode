<div class="modal modal-open modal-glass" role="dialog">
  <div class="modal-box glass-panel-thick modal-box-glass w-11/12 max-w-2xl p-6 sm:p-8">
    <div class="flex flex-col gap-6">
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-start gap-3">
          <span class="icone-acao icone-acao-grande text-agua-700 shrink-0">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <use href="#glifo-titular"/>
            </svg>
          </span>
          <div>
            <h2 class="text-xl font-bold tracking-tight text-madeira-700">Definir ou trocar titular</h2>
            <p class="text-sm text-base-content/70 mt-1">Selecione a unidade subordinada para gerenciar a titularidade.</p>
          </div>
        </div>
        <button type="button"
                class="btn btn-ghost btn-circle btn-sm text-base-content/60 hover:text-base-content"
                onclick="document.getElementById('poco-modal').innerHTML = '';"
                aria-label="Fechar">
          ✕
        </button>
      </div>

      <div class="card-well p-4">
        <label class="form-field">
          <span class="text-overline">Unidade subordinada</span>
          <select name="unidade"
                  class="select select-glass w-full"
                  data-select-onsen
                  hx-get="{% url 'unidades:face_titularidade' %}"
                  hx-target="#face-titularidade"
                  hx-swap="innerHTML settle:150ms">
            <option value="">Selecione uma unidade...</option>
            {% for u in unidades %}
              <option value="{{ u.pk }}">{{ u.sigla }} · {{ u.nome }}</option>
            {% endfor %}
          </select>
          <span class="form-field-hint">Apenas unidades estritamente abaixo daquelas que você dirige.</span>
        </label>
      </div>

      <div id="face-titularidade"></div>
    </div>
  </div>
  <button type="button" class="modal-backdrop" onclick="document.getElementById('poco-modal').innerHTML = '';">Fechar</button>
</div>
