{# Modal de nova unidade (SPEC user_admin/012). Vive FORA de qualquer formulário — formulário       #}
{# dentro de formulário é HTML inválido e o navegador descarta o interno; o <label for> alcança o    #}
{# modal de qualquer lugar do documento. Abre e fecha por checkbox nativo, sem JavaScript: o foco    #}
{# vem do embaçamento do fundo (§6 do design system), nunca de véu escuro.                          #}
<input type="checkbox" id="modal-nova-unidade" class="modal-toggle" />
<div class="modal modal-glass" role="dialog">
  <div class="modal-box glass-panel-thick modal-box-glass w-11/12 max-w-2xl p-6 sm:p-8">
    {# Gravar unidade é ato administrativo, registrado (SPEC user_admin/020): a recusa/sucesso troca #}
    {# só o bloco `#campos-nova-unidade` que `_campos_unidade.html` já declara — o resto do modal    #}
    {# (título, botões) fica parado. O id é o mesmo que cada campo aponta via `form=`.               #}
    <form id="form-nova-unidade"
          hx-post="{% url 'unidades:gravar_unidade_e_selecionar' %}"
          hx-target="#campos-nova-unidade"
          hx-swap="outerHTML"
          class="flex flex-col gap-6">
      <div>
        <h2 class="text-xl font-bold tracking-tight text-madeira-700">Nova unidade</h2>
        <p class="text-sm text-base-content/70 mt-1">A unidade cadastrada aqui fica disponível para a lotação do servidor.</p>
      </div>

      {% include "unidades/partials/_campos_unidade.html" %}

      <div class="flex justify-end gap-3 pt-1">
        <label for="modal-nova-unidade" class="btn btn-ghost btn-glass">Cancelar</label>
        <button type="submit" class="btn btn-onsen">Salvar unidade</button>
      </div>
    </form>
  </div>
  <label class="modal-backdrop" for="modal-nova-unidade">Fechar</label>
</div>
