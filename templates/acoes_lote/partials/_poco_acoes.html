{% load icones %}
{% if itens %}
  <div class="card-well px-4 pt-2.5 pb-3 flex flex-col gap-1 w-full" id="poco-acoes-lote">
    <p class="text-overline shrink-0 leading-none">Ações</p>
    <div class="flex flex-col gap-2.5 px-1 py-1 overflow-y-auto overscroll-contain [mask-image:linear-gradient(to_bottom,transparent,black_8px,black_calc(100%-8px),transparent)]">
      {% for item in itens %}
        <button type="button" class="btn btn-onsen btn-sm gap-2 justify-start"
                hx-get="{% url item.url_name %}?id={{ id_entidade }}&sql={{ sql }}"
                hx-target="#poco-modal">
          <span class="w-4 h-4 shrink-0 flex items-center justify-center [&>svg]:w-full [&>svg]:h-full">
            {% icone_acao item.acao.acao.slug "pequeno" %}
          </span>
          {{ item.acao.acao.nome_curto }}
        </button>
      {% endfor %}
    </div>
  </div>
{% endif %}
