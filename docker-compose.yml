name: dimap-geocode

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dimap_geocode}
      POSTGRES_USER: ${POSTGRES_USER:-dimap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dimap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dimap} -d ${POSTGRES_DB:-dimap_geocode}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .                      # contexto na raiz: dá acesso a pyproject.toml, uv.lock e ao código
      dockerfile: docker/Dockerfile.web
    # Sem `command`: usa o CMD do Dockerfile (runserver). A migração é feita
    # pelo entrypoint.sh, compartilhado entre dev e prod.
    environment:
      # Consumidos pelo config/settings.py (via Pydantic Settings, ver CLAUDE.md, "Stack").
      DJANGO_AUTO_MIGRATE: ${DJANGO_AUTO_MIGRATE:-1}
      DJANGO_AUTO_SEED: ${DJANGO_AUTO_SEED:-1}
      POSTGRES_DB: ${POSTGRES_DB:-dimap_geocode}
      POSTGRES_USER: ${POSTGRES_USER:-dimap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dimap}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-key-change-me}
    volumes:
      # Bind mount do código para hot-reload; o venv vive em /opt/venv (intacto).
      - .:/app
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      tailwind:
        # CSS que não compila impede o web de subir, em vez de deixá-lo servir o output.css da
        # subida anterior — a falha silenciosa que motivou a SPEC infraestrutura/004.
        condition: service_healthy

  # Build do CSS (Tailwind 4 + daisyUI 5) em watch: compila static/src/input.css ->
  # static/dist/output.css, que chega ao `web` pelo mesmo bind mount do código.
  tailwind:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: css-watch
    volumes:
      - .:/app
    healthcheck:
      # É este teste que o `web` espera: sem ele a primeira página de uma subida limpa sai sem CSS.
      test: ["CMD-SHELL", "test -s static/dist/output.css"]
      interval: 2s
      timeout: 2s
      retries: 30

  daemon:
    build:
      context: .
      dockerfile: docker/Dockerfile.daemon
    # Flag de subida: serviço só existe sob o profile `atualizacao`.
    #   docker compose up                          → db + web (sem atualização automática)
    #   docker compose --profile atualizacao up    → db + web + daemon
    profiles: ["atualizacao"]
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings}
      DTIME_ATUALIZACAO_ARQUIVOS: ${DTIME_ATUALIZACAO_ARQUIVOS:-03:00}
      # Sem DJANGO_AUTO_MIGRATE (não há entrypoint) e sem variáveis de banco:
      # o pipeline vai do WFS ao parquet e não consulta o Postgres.
    volumes:
      # Mesmo bind mount do web: é ele que faz os parquets caírem no data/ do host.
      - .:/app
    # Sem `depends_on`, sem `ports`: não fala com o banco e não serve HTTP.

volumes:
  pgdata:
