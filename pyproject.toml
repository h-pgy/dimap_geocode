[project]
name = "dimap-geocode"
version = "0.1.0"
description = "Aplicativo web de geocodificação sobre dados oficiais de logradouros, lotes fiscais e endereços da Prefeitura de São Paulo (PMSP)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0",
    "django-ninja>=1.6.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.1",
    "requests>=2.34.2",
    "pyarrow>=19.0",
    "pandas>=3.0.3",
    "rapidfuzz>=3.14.5",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.9",
    "mypy>=1.15",
    "django-stubs>=6.0.5",
    "pandas-stubs>=2.2",
    "pytest-django>=4.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-m 'not integration and not banco'"
markers = [
    "integration: testes de integração com dados reais (rode com: pytest -m integration)",
    "banco: testes que exigem banco PostGIS de pé (rode com: pytest -m banco)",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"
